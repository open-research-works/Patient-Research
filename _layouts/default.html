<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  {% if site.prelaunch %}<meta name="robots" content="noindex,nofollow">{% endif %}
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">Patient Research</a>
      <nav class="main-nav" aria-label="Hauptnavigation">
        <a href="{{ '/themen.html' | relative_url }}">Themen</a>
        <a href="{{ '/methodik.html' | relative_url }}">Methodik</a>
        <a href="{{ '/ueber.html' | relative_url }}">Über</a>
      </nav>
    </div>
  </header>

  {% if site.prelaunch %}
  <div class="prelaunch-bar">Pre-Launch · noch nicht für Suchmaschinen freigegeben</div>
  {% endif %}

  <main class="shell {% if page.wide %}shell-wide{% endif %}">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <div><strong>Patient Research</strong><br><span>Lebende medizinische Dossiers mit klarer Trennung von Befund, Evidenz und Beobachtung.</span></div>
      <div class="footer-links"><a href="{{ '/methodik.html' | relative_url }}">Methodik</a> · <a href="{{ '/ueber.html' | relative_url }}">Über</a></div>
    </div>
  </footer>
</body>
</html>
